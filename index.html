<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e8edf0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#11181d" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>White Noise</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #e8edf0;
      --surface: #f7f9fa;
      --surface-2: #dbe3e7;
      --text: #172127;
      --muted: #5a6971;
      --line: #c4d0d5;
      --accent: #146777;
      --accent-strong: #0b4e5b;
      --accent-soft: #c7e5e8;
      --power-face: #145f6e;
      --power-shadow: rgba(17, 67, 76, .24);
      --focus: #cf6b35;
      --ring: rgba(20, 103, 119, .16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11181d;
        --surface: #182229;
        --surface-2: #223039;
        --text: #eff4f5;
        --muted: #a7b5bc;
        --line: #33444d;
        --accent: #75c6cf;
        --accent-strong: #a0dce2;
        --accent-soft: #23464e;
        --power-face: #5fb7c2;
        --power-shadow: rgba(79, 186, 198, .22);
        --focus: #f0a06e;
        --ring: rgba(117, 198, 207, .15);
      }
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 18%, var(--surface) 0, transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button { color: inherit; }

    .shell {
      width: min(100%, 680px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .intro {
      max-width: 520px;
      margin-bottom: 28px;
    }

    h1 {
      max-width: 500px;
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.65rem);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 600;
    }

    .intro p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.55;
    }

    .player {
      padding: 30px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 30px 30px 12px 30px;
      box-shadow: 0 22px 60px rgba(25, 45, 54, .09);
    }

    .sound-stage {
      min-height: 250px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .halo, .halo::before, .halo::after {
      position: absolute;
      border: 1px solid var(--ring);
      border-radius: 50%;
      content: "";
    }

    .halo {
      width: 212px;
      height: 212px;
      transition: opacity .3s ease;
    }

    .halo::before { inset: -28px; }
    .halo::after { inset: -58px; }

    .is-playing .halo { animation: breathe 4s ease-in-out infinite; }
    .is-playing .halo::before { animation: breathe 4s 1.1s ease-in-out infinite; }
    .is-playing .halo::after { animation: breathe 4s 2.2s ease-in-out infinite; }

    @keyframes breathe {
      0%, 100% { transform: scale(.94); opacity: .45; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .power {
      position: relative;
      z-index: 2;
      width: 142px;
      height: 142px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--power-face);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 15px 40px var(--power-shadow), inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .18s ease, box-shadow .25s ease, background .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .power:hover { transform: translateY(-2px); }
    .power:active { transform: translateY(1px) scale(.98); }
    .power svg { width: 38px; height: 38px; }

    .power .pause-icon { display: none; }
    .is-playing .power .play-icon { display: none; }
    .is-playing .power .pause-icon { display: block; }

    .status-row {
      min-height: 26px;
      margin: -1px 0 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--muted);
      font-size: .94rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line);
      transition: background .25s ease, box-shadow .25s ease;
    }

    .is-playing .status-dot {
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--ring);
    }

    .noise-picker {
      border: 0;
      padding: 0;
      margin: 0 0 28px;
    }

    .noise-picker legend,
    .control-label {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .segments {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 5px;
      background: var(--surface-2);
      border-radius: 14px;
    }

    .mode {
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 500;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .mode[aria-pressed="true"] {
      background: var(--surface);
      color: var(--accent-strong);
      box-shadow: 0 2px 8px rgba(13, 36, 44, .12);
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 14px;
      margin-bottom: 8px;
    }

    .level {
      min-width: 46px;
      text-align: right;
      font-family: "IBM Plex Mono", monospace;
      font-size: .9rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      height: 28px;
      margin: 0 0 23px;
      background: transparent;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: linear-gradient(to right, var(--accent) 0 var(--level, 42%), var(--surface-2) var(--level, 42%) 100%);
      border-radius: 6px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -8px;
      border-radius: 50%;
      border: 3px solid var(--surface);
      background: var(--accent);
      box-shadow: 0 1px 5px rgba(0,0,0,.25);
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      background: var(--surface-2);
      border-radius: 6px;
    }

    input[type="range"]::-moz-range-progress {
      height: 6px;
      background: var(--accent);
      border-radius: 6px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 1px 5px rgba(0,0,0,.25);
    }

    .timer-block {
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .timer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .timer-head .control-label { margin: 0; }

    .countdown {
      min-height: 20px;
      color: var(--accent-strong);
      font-family: "IBM Plex Mono", monospace;
      font-size: .82rem;
    }

    .timer-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .timer {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 500;
    }

    .timer[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .hint {
      margin: 18px 4px 0;
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.45;
    }

    .home-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .home-pill {
      display: inline-block;
      padding: 7px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-size: .85rem;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
    }

    .home-pill:hover { color: var(--accent-strong); }

    .home-pill:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      .shell {
        justify-content: flex-start;
        padding-left: 15px;
        padding-right: 15px;
      }
      .intro { margin: 14px 7px 22px; }
      .player { padding: 22px 18px; border-radius: 24px 24px 10px 24px; }
      .sound-stage { min-height: 224px; }
      .power { width: 126px; height: 126px; }
      .halo { width: 184px; height: 184px; }
      .halo::before { inset: -24px; }
      .halo::after { inset: -48px; }
      .timer-options { gap: 6px; }
      .timer { font-size: .8rem; }
    }

    @media (max-width: 350px) {
      .player { padding-left: 14px; padding-right: 14px; }
      .timer-options { grid-template-columns: repeat(2, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .power { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="home-bar">
      <a class="home-pill" href="https://jesuslovestyler.com/">⌂ Home</a>
    </div>

    <section class="intro" aria-labelledby="page-heading">
      <h1 id="page-heading">Settle into steady sound.</h1>
      <p>Tap play, choose a tone, and set the level that feels right.</p>
    </section>

    <section class="player" id="player" aria-label="Noise player">
      <div class="sound-stage">
        <div class="halo" aria-hidden="true"></div>
        <button class="power" id="power" type="button" aria-label="Play white noise" aria-pressed="false">
          <svg class="play-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M8.2 5.8v12.4c0 .8.9 1.2 1.5.8l8.1-6.2a1 1 0 0 0 0-1.6L9.7 5c-.6-.4-1.5 0-1.5.8Z" fill="currentColor"/></svg>
          <svg class="pause-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M7 5.5h3.4v13H7v-13Zm6.6 0H17v13h-3.4v-13Z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="status-row" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Ready to play</span>
      </div>

      <fieldset class="noise-picker">
        <legend>Noise color</legend>
        <div class="segments">
          <button class="mode" type="button" data-noise="white" aria-pressed="true">White</button>
          <button class="mode" type="button" data-noise="pink" aria-pressed="false">Pink</button>
          <button class="mode" type="button" data-noise="brown" aria-pressed="false">Brown</button>
        </div>
      </fieldset>

      <div class="control-row">
        <label class="control-label" for="volume">Volume</label>
        <output class="level" id="level" for="volume">42%</output>
      </div>
      <input id="volume" type="range" min="0" max="100" value="42" aria-valuetext="42 percent" style="--level: 42%" />

      <div class="timer-block">
        <div class="timer-head">
          <div class="control-label">Sleep timer</div>
          <div class="countdown" id="countdown" aria-live="polite"></div>
        </div>
        <div class="timer-options" aria-label="Sleep timer options">
          <button class="timer" type="button" data-minutes="0" aria-pressed="true">Off</button>
          <button class="timer" type="button" data-minutes="15" aria-pressed="false">15 min</button>
          <button class="timer" type="button" data-minutes="30" aria-pressed="false">30 min</button>
          <button class="timer" type="button" data-minutes="60" aria-pressed="false">1 hour</button>
        </div>
      </div>
    </section>

    <p class="hint">Sound keeps playing while this page stays open.</p>
  </main>

  <script>
    (function () {
      "use strict";

      var player = document.getElementById("player");
      var power = document.getElementById("power");
      var statusText = document.getElementById("statusText");
      var volume = document.getElementById("volume");
      var level = document.getElementById("level");
      var countdown = document.getElementById("countdown");
      var modeButtons = Array.prototype.slice.call(document.querySelectorAll(".mode"));
      var timerButtons = Array.prototype.slice.call(document.querySelectorAll(".timer"));

      var audioContext = null;
      var source = null;
      var gainNode = null;
      var currentNoise = "white";
      var isPlaying = false;
      var endTime = null;
      var timerInterval = null;

      function createNoiseBuffer(type) {
        var seconds = 8;
        var length = audioContext.sampleRate * seconds;
        var buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
        var data = buffer.getChannelData(0);
        var i;

        if (type === "pink") {
          var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (i = 0; i < length; i += 1) {
            var white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
            b6 = white * 0.115926;
          }
        } else if (type === "brown") {
          var last = 0;
          for (i = 0; i < length; i += 1) {
            var random = Math.random() * 2 - 1;
            last = (last + 0.02 * random) / 1.02;
            data[i] = last * 3.5;
          }
        } else {
          for (i = 0; i < length; i += 1) {
            data[i] = (Math.random() * 2 - 1) * 0.64;
          }
        }
        return buffer;
      }

      function ensureAudio() {
        if (!audioContext) {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioContext = new AudioContextClass();
          gainNode = audioContext.createGain();
          gainNode.gain.value = Number(volume.value) / 100;
          gainNode.connect(audioContext.destination);
        }
        if (audioContext.state === "suspended") {
          return audioContext.resume();
        }
        return Promise.resolve();
      }

      function startSource() {
        if (source) {
          try { source.stop(); } catch (error) { /* already stopped */ }
          source.disconnect();
        }
        source = audioContext.createBufferSource();
        source.buffer = createNoiseBuffer(currentNoise);
        source.loop = true;
        source.connect(gainNode);
        source.start();
      }

      function updateUI() {
        player.classList.toggle("is-playing", isPlaying);
        power.setAttribute("aria-pressed", String(isPlaying));
        power.setAttribute("aria-label", isPlaying ? "Pause noise" : "Play " + currentNoise + " noise");
        statusText.textContent = isPlaying ? currentNoise.charAt(0).toUpperCase() + currentNoise.slice(1) + " noise playing" : "Ready to play";
      }

      function play() {
        ensureAudio().then(function () {
          startSource();
          isPlaying = true;
          updateUI();
        }).catch(function () {
          statusText.textContent = "Sound could not start. Tap again.";
        });
      }

      function stop() {
        if (source) {
          try { source.stop(); } catch (error) { /* already stopped */ }
          source.disconnect();
          source = null;
        }
        isPlaying = false;
        updateUI();
      }

      power.addEventListener("click", function () {
        if (isPlaying) { stop(); } else { play(); }
      });

      modeButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          currentNoise = button.getAttribute("data-noise");
          modeButtons.forEach(function (item) {
            item.setAttribute("aria-pressed", String(item === button));
          });
          if (isPlaying) { startSource(); }
          updateUI();
        });
      });

      volume.addEventListener("input", function () {
        var value = Number(volume.value);
        level.value = value + "%";
        volume.style.setProperty("--level", value + "%");
        volume.setAttribute("aria-valuetext", value + " percent");
        if (gainNode && audioContext) {
          gainNode.gain.cancelScheduledValues(audioContext.currentTime);
          gainNode.gain.linearRampToValueAtTime(value / 100, audioContext.currentTime + 0.04);
        }
      });

      function clearSleepTimer() {
        endTime = null;
        countdown.textContent = "";
        if (timerInterval) {
          window.clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function updateCountdown() {
        if (!endTime) { return; }
        var remaining = Math.max(0, endTime - Date.now());
        if (remaining <= 0) {
          clearSleepTimer();
          stop();
          timerButtons.forEach(function (item) {
            item.setAttribute("aria-pressed", String(item.getAttribute("data-minutes") === "0"));
          });
          statusText.textContent = "Sleep timer finished";
          return;
        }
        var totalSeconds = Math.ceil(remaining / 1000);
        var minutes = Math.floor(totalSeconds / 60);
        var seconds = totalSeconds % 60;
        countdown.textContent = minutes + ":" + String(seconds).padStart(2, "0") + " left";
      }

      timerButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          var minutes = Number(button.getAttribute("data-minutes"));
          timerButtons.forEach(function (item) {
            item.setAttribute("aria-pressed", String(item === button));
          });
          clearSleepTimer();
          if (minutes > 0) {
            endTime = Date.now() + minutes * 60 * 1000;
            updateCountdown();
            timerInterval = window.setInterval(updateCountdown, 1000);
          }
        });
      });

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) { updateCountdown(); }
      });

      updateUI();
    }());
  </script>
  <script data-goatcounter="https://jesuslovestyler.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
